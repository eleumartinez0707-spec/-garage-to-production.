<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Making Chips</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='16' fill='%231a1f27'/%3E%3Crect x='20' y='62' width='60' height='12' rx='3' fill='%233a4252'/%3E%3Crect x='34' y='46' width='32' height='14' rx='2' fill='%238a929e'/%3E%3Crect x='47' y='16' width='6' height='32' fill='%234a5468'/%3E%3Ccircle cx='50' cy='48' r='5' fill='%23ff9d2f'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#12151a; --bg2:#1a1f27; --panel:#1e2530; --panel2:#252d3a; --border:#333d4d;
  --text:#e8ecf2; --text-dim:#a7b0c0; --accent:#ff9d2f; --accent2:#3fb6ff; --good:#3ecf6a;
  --warn:#ffcc33; --bad:#ff5c5c; --focus:#7fd4ff;
  --radius:10px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  min-height:100vh; -webkit-tap-highlight-color:transparent;
}
h1,h2,h3,h4{margin:0 0 .4em 0; font-weight:700;}
p{margin:.3em 0;}
button{
  font-family:inherit; font-size:1rem; cursor:pointer; color:var(--text);
  background:var(--panel2); border:1px solid var(--border); border-radius:8px;
  padding:.6em 1em; min-height:44px; touch-action:manipulation;
}
button:hover{ filter:brightness(1.15); }
button:active{ filter:brightness(0.9); }
button:disabled{ opacity:.45; cursor:not-allowed; filter:none; }
button.primary{ background:var(--accent); color:#1a1200; border-color:var(--accent); font-weight:700; }
button.primary:hover{ filter:brightness(1.08); }
button.secondary{ background:var(--accent2); color:#001522; border-color:var(--accent2); font-weight:700; }
button.danger{ background:var(--bad); color:#2a0000; border-color:var(--bad); font-weight:700; }
button.ghost{ background:transparent; }
button.tab-btn{ flex:0 0 auto; border-radius:0; border:none; border-bottom:3px solid transparent; background:var(--bg2); white-space:nowrap; padding:.6em .8em; font-size:.92rem; }
@media (min-width:560px){ button.tab-btn{ flex:1 1 0; font-size:1rem; padding:.6em 1em; } }
button.tab-btn[aria-selected="true"]{ border-bottom-color:var(--accent); background:var(--panel); color:var(--accent);}
a, button, input, select, [tabindex]{ }
:focus-visible{ outline:3px solid var(--focus); outline-offset:2px; }
input[type=range]{ width:100%; }
input[type=text], input[type=number], select{
  background:var(--bg2); color:var(--text); border:1px solid var(--border); border-radius:8px;
  padding:.5em .6em; font-size:1rem; min-height:44px;
}
label{ display:block; margin:.5em 0 .2em; font-size:.9rem; color:var(--text-dim); }
.visually-hidden{ position:absolute; width:1px;height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
.hidden{ display:none !important; }
.row{ display:flex; gap:.5em; flex-wrap:wrap; align-items:center; }
.spread{ display:flex; justify-content:space-between; align-items:center; gap:.5em; flex-wrap:wrap;}
.card{ background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:1em; }
.muted{ color:var(--text-dim); }
.pill{ display:inline-block; padding:.15em .6em; border-radius:999px; font-size:.78rem; border:1px solid var(--border); background:var(--bg2); }
.pill.good{ color:var(--good); border-color:var(--good); }
.pill.warn{ color:var(--warn); border-color:var(--warn); }
.pill.bad{ color:var(--bad); border-color:var(--bad); }
.bar-track{ background:var(--bg2); border-radius:999px; height:14px; overflow:hidden; border:1px solid var(--border); }
.bar-fill{ height:100%; background:var(--accent2); transition:width .25s ease; }
.bar-fill.good{ background:var(--good); }
.bar-fill.warn{ background:var(--warn); }
.bar-fill.bad{ background:var(--bad); }

/* ---------- START SCREEN ---------- */
#start-screen{
  min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:clamp(.7em,2vw,1.4em); text-align:center; position:relative; overflow-x:hidden;
  background:
    linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px),
    radial-gradient(ellipse at 50% -15%,#333842 0%,#171b21 58%,#0d1014 100%);
  background-size:32px 32px,32px 32px,auto;
}
.title-logo-wrap{ margin:0; line-height:0; }
.title-logo{ width:min(88vw,660px); height:auto; image-rendering:auto; filter:drop-shadow(0 9px 0 rgba(0,0,0,.48)); }
#start-screen .subtitle{ color:#d0d6df; margin:.35em 0 .8em; font-family:"Courier New",monospace; letter-spacing:.08em; text-transform:uppercase; text-shadow:0 2px #000; }
.mill-stage{ width:min(94vw,440px); position:relative; margin:0 auto 1em; pointer-events:none; overflow:hidden; border-radius:8px; border:2px solid #000; background:#0d0d0c; }
.mill-stage .shop-scene-img{ width:100%; height:auto; display:block; image-rendering:pixelated; }
.mill-scene{ position:absolute; inset:0; }
.mill-scene svg{ width:100%; height:100%; display:block; }
.mill-hud-l, .mill-hud-r{ position:absolute; top:6px; max-width:48%; font-family:'Courier New',monospace; font-size:.6rem; line-height:1.5; color:#c9c87a; text-shadow:0 0 3px rgba(201,200,122,.5); letter-spacing:.5px; text-transform:uppercase; background:rgba(0,0,0,.4); padding:3px 6px; border-radius:3px; }
.mill-hud-l{ left:8px; }
.mill-hud-r{ right:8px; text-align:right; }
.mill-hud-l div, .mill-hud-r div{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.chip-layer{ position:absolute; inset:0; pointer-events:none; }
.chip{ position:absolute; width:6px; height:2px; background:#c9d3de; border-radius:0; opacity:0; pointer-events:none; }
.chip.chip-b{ background:#8a929e; }
@keyframes chip-fly{
  0%{ opacity:1; transform:translate(0,0) rotate(0deg) scale(1); }
  60%{ opacity:1; }
  100%{ opacity:0; transform:var(--chip-end) rotate(90deg) scale(.7); }
}
.start-control-row{ display:flex; align-items:center; justify-content:center; gap:clamp(.45em,1.5vw,1em); width:min(96vw,1000px); }
.mode-select{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:clamp(.45em,1.5vw,1em); margin:0; width:min(80vw,700px); }
.mode-btn{
  min-width:0; aspect-ratio:1.49/1; padding:0; border:0; border-radius:0; line-height:0;
  background:transparent center/contain no-repeat; color:transparent;
  box-shadow:none; transition:transform .08s ease,filter .08s ease;
}
.mode-btn-clean{ background-image:url("assets/title/clean-hands.png"); }
.mode-btn-shop{ background-image:url("assets/title/shop-hands.png"); }
.mode-btn:hover{ filter:brightness(1.12); }
.mode-btn:active{ transform:translateY(4px); }
.mode-btn[aria-pressed="true"]{ filter:brightness(1.14) drop-shadow(0 0 7px #ffd03b); transform:translateY(-2px); }
.start-settings-btn{
  flex:0 1 235px; width:min(24vw,235px); aspect-ratio:2.62/1; min-height:0; padding:0; border:0; border-radius:0;
  background:transparent url("assets/title/settings.png") center/contain no-repeat; color:transparent; box-shadow:none;
}
.start-settings-btn:hover{ filter:brightness(1.15); }
.start-status-strip{ display:flex; justify-content:center; align-items:center; gap:clamp(.35em,1.2vw,.8em); width:min(94vw,820px); margin:.8em auto .15em; }
.start-status-strip img{ display:block; max-height:72px; max-width:22%; width:auto; object-fit:contain; filter:drop-shadow(0 5px 0 rgba(0,0,0,.38)); }
.start-status-strip .status-wide{ max-width:29%; }
#start-screen .mode-desc{ max-width:650px; color:#c9d0da; font-size:.84rem; min-height:1.4em; margin:.55em 0 .2em; }
.start-actions{ display:flex; gap:.7em; flex-wrap:wrap; justify-content:center; margin-top:.45em; }
.start-actions button{ min-width:190px; font-size:1rem; font-weight:800; text-transform:uppercase; letter-spacing:.04em; border:3px solid #0a0c0f; box-shadow:0 4px 0 #050607; }
#continue-hint{ margin-top:.45em !important; }
@media (max-width:640px){
  #start-screen{ justify-content:flex-start; padding-top:.65em; }
  .title-logo{ width:min(94vw,520px); }
  #start-screen .subtitle{ font-size:.72rem; }
  .start-control-row{ flex-direction:column; }
  .mode-select{ width:min(96vw,570px); gap:.25em; }
  .start-settings-btn{ width:180px; flex-basis:auto; }
  .start-status-strip{ gap:.15em; margin-top:.45em; }
  .start-status-strip img{ max-height:48px; }
  .start-actions{ gap:.4em; }
  .start-actions button{ min-width:145px; font-size:.82rem; min-height:40px; }
  #start-screen .mode-desc{ font-size:.75rem; min-height:2.2em; }
}

/* ---------- APP LAYOUT ---------- */
#app{ display:flex; flex-direction:column; min-height:100vh; }
#header-bar{
  position:sticky; top:0; z-index:20; background:var(--bg2); border-bottom:1px solid var(--border);
  padding:.5em .7em; display:flex; flex-wrap:wrap; gap:.4em .9em; align-items:center;
}
#header-bar .stat{ font-size:.85rem; color:var(--text-dim); display:flex; flex-direction:column; line-height:1.15;}
#header-bar .stat strong{ color:var(--text); font-size:1rem; }
#speed-controls{ margin-left:auto; display:flex; gap:.3em; }
#speed-controls button{ min-width:44px; padding:.4em .6em; }
#speed-controls button[aria-pressed="true"]{ background:var(--accent2); color:#001522; border-color:var(--accent2);}
#milestone-bar{ width:100%; margin-top:.3em; }
#milestone-bar button{ width:100%; text-align:left; background:var(--panel); }
#tabs-bar{ display:flex; position:sticky; top:0; z-index:19; background:var(--bg2); border-bottom:1px solid var(--border); overflow-x:auto; -webkit-overflow-scrolling:touch; }
main{ flex:1; padding:.8em; padding-bottom:2.5em; max-width:900px; margin:0 auto; width:100%; }
.tab-panel{ display:none; }
.tab-panel.active{ display:block; }
.job-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:.8em; }
.job-card{ display:flex; flex-direction:column; gap:.35em; }
.job-card .facts{ display:grid; grid-template-columns:1fr 1fr; gap:.15em .6em; font-size:.82rem; color:var(--text-dim); margin:.3em 0; }
.job-card .facts b{ color:var(--text); font-weight:600; }
.jc-sub{ font-size:.82rem; margin-top:-.2em; }
.jc-row{ display:flex; align-items:center; gap:.6em; }
.jc-price{ font-size:1.15rem; font-weight:700; }
.jc-deadline{ font-size:.85rem; color:var(--text-dim); margin-left:auto; }
.jc-meta{ gap:.5em; }
.jc-qty{ font-size:.82rem; margin-left:auto; }
.mat-chip{ display:inline-block; padding:.1em .5em; border-radius:5px; border:1px solid; font-size:.78rem; font-weight:700; }
.diff-dots{ display:inline-flex; gap:2px; vertical-align:middle; }
.diff-dot{ width:7px; height:7px; background:var(--bg2); border:1px solid var(--border); display:inline-block; }
.diff-dot.filled{ background:var(--accent); border-color:var(--accent); }
.section-title{ margin-top:1.4em; }
.quick-jobs-collapse{ margin-top:1.6em; border-top:1px solid var(--border); padding-top:.4em; }
.quick-jobs-collapse summary{ cursor:pointer; font-size:1.15rem; font-weight:700; padding:.6em 0; min-height:44px; display:flex; align-items:center; gap:.4em; list-style:none; }
.quick-jobs-collapse summary::-webkit-details-marker{ display:none; }
.quick-jobs-collapse summary::before{ content:"â–¸"; display:inline-block; transition:transform .15s ease; }
.quick-jobs-collapse[open] summary::before{ transform:rotate(90deg); }
.upgrade-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:.8em; }
.stat-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:.6em; margin:.6em 0; }
.stat-box{ background:var(--bg2); border:1px solid var(--border); border-radius:8px; padding:.5em .7em; }
.stat-box .v{ font-size:1.2rem; font-weight:700; }
.stat-box .l{ font-size:.75rem; color:var(--text-dim); }
table{ width:100%; border-collapse:collapse; font-size:.85rem; }
table th, table td{ text-align:left; padding:.35em .4em; border-bottom:1px solid var(--border); }

/* modal */
.modal-backdrop{ position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; align-items:flex-end; justify-content:center; z-index:50; padding:0; }
@media (min-width:640px){ .modal-backdrop{ align-items:center; padding:1em; } }
.modal{ background:var(--panel); border:1px solid var(--border); border-radius:var(--radius) var(--radius) 0 0; max-width:640px; width:100%; max-height:92vh; overflow-y:auto; padding:1.1em; overscroll-behavior:contain; }
/* Manufacturing modal: stage tabs wrap instead of clipping, and the panel
   uses more of a phone's width for the part preview. */
#mfg-tabs{ display:flex; flex-wrap:wrap; gap:.3em; margin-bottom:.6em; }
#mfg-tabs button{ flex:1 1 auto; min-width:0; font-size:.76rem; padding:.5em .35em; white-space:nowrap; }
.mfg-modal #mfg-mill{ max-width:100% !important; }
@media (max-width:560px){
  .modal.mfg-modal{ padding:.7em; }
  .mfg-modal .modal-header h2{ font-size:1.15rem; }
  #mfg-tabs button{ font-size:.72rem; padding:.5em .25em; }
}
@media (min-width:640px){ .modal{ border-radius:var(--radius);} }
body.mc-gesture-lock{ position:fixed; inset:0; overflow:hidden; overscroll-behavior:none; touch-action:none; }
.modal-header{ display:flex; justify-content:space-between; align-items:center; gap:.5em; margin-bottom:.5em; }
.close-x{ background:transparent; border:none; font-size:1.4rem; padding:.2em .5em; min-width:44px; }

/* production visual */
.mill-mini{ width:100%; max-width:340px; height:180px; margin:0 auto; pointer-events:none; position:relative; overflow:hidden; border-radius:8px; border:2px solid #000; image-rendering:pixelated; background:#0d0d0c; }
/* Mill-area machine visual: four real, separately-authored layers (see
   assets/mill/) stacked in the same coordinate space instead of one
   flattened sprite. .mill2-bg is a plain <img>, never touched by any
   animation rule below, so the enclosure/table/vise/workpiece structurally
   cannot move. The other three are div's with a background-image sprite
   sheet (8 frames laid out horizontally) stepped via background-position;
   background-size:800% makes each frame exactly one container-width wide. */
.mill2{ position:relative; width:100%; height:100%; }
.mill2-frame{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); height:96%; aspect-ratio:80/50; image-rendering:pixelated; }
.mill2-sprite{ background-repeat:no-repeat; background-position:0 0; background-size:800% 100%; opacity:0; }
.mill2.idle .mill2-spindle{ opacity:1; }
.mill2.running .mill2-spindle{ opacity:1; }
.mill2.running.wet .mill2-coolant{ opacity:1; }
.mill2.running .mill2-chips{ opacity:1; }
.mill2.running.wet .mill2-spindle,
.mill2.running.wet .mill2-coolant,
.mill2.running.wet .mill2-chips,
.mill2.running.dry .mill2-spindle,
.mill2.running.dry .mill2-chips{ animation:millSpriteLoop 710ms steps(1, end) infinite; }
